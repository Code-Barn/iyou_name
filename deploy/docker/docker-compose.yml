services:
  # Namechart Django application
  web:
    build:
      context: /home/user/CODE_BASE/namechart
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - USE_DOCKER_DB=1
      - POSTGRES_DB=namechart
      - POSTGRES_USER=namechart
      - POSTGRES_PASSWORD=namechart_secret
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      # Genealogy settings
      - GENEALOGY_MODE=${GENEALOGY_MODE:-disabled}
      - GENEALOGY_EXTERNAL_URL=${GENEALOGY_EXTERNAL_URL:-}
      - GRAMPSWEB_API_URL=http://grampsweb:5000
      - GRAMPSWEB_BASE_URL=${GRAMPSWEB_BASE_URL:-http://localhost:8080}
      - GRAMPSWEB_API_TOKEN=${GRAMPSWEB_API_TOKEN:-}
      - WEBTREES_URL=${WEBTREES_URL:-http://localhost:8081}
      - WEBTREES_API_URL=${WEBTREES_API_URL:-}
      - WEBTREES_API_TOKEN=${WEBTREES_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PostgreSQL for namechart
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      - POSTGRES_DB=namechart
      - POSTGRES_USER=namechart
      - POSTGRES_PASSWORD=namechart_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namechart -d namechart"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  # GrampsWeb - Private genealogy
  grampsweb:
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: unless-stopped
    ports:
      - "8080:5000"
    environment:
      - GRAMPSWEB_TREE=${GRAMPSWEB_TREE:-Family Tree}
      - GRAMPSWEB_SECRET_KEY=${GRAMPSWEB_SECRET_KEY:-change-me-in-production}
      - GRAMPSWEB_BASE_URL=${GRAMPSWEB_BASE_URL:-http://localhost:8080}
      - GRAMPSWEB_CELERY_CONFIG__broker_url=redis://redis:6379/0
      - GRAMPSWEB_CELERY_CONFIG__result_backend=redis://redis:6379/0
      - GRAMPSWEB_RATELIMIT_STORAGE_URI=redis://redis:6379/1
      - GRAMPSWEB_USER_DB_URI=postgresql://namechart:namechart_secret@db:5432/grampsweb
      - GRAMPSWEB_CORS_ORIGINS=${GRAMPSWEB_CORS_ORIGINS:-http://localhost:8000,http://localhost:3000}
      - GRAMPSWEB_EMAIL_HOST=${EMAIL_HOST:-}
      - GRAMPSWEB_EMAIL_PORT=${EMAIL_PORT:-465}
      - GRAMPSWEB_EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - GRAMPSWEB_EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - GRAMPSWEB_EMAIL_USE_SSL=${EMAIL_USE_SSL:-True}
      - GRAMPSWEB_DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@example.com}
    volumes:
      - gramps_users:/app/users
      - gramps_index:/app/indexdir
      - gramps_thumb_cache:/app/thumbnail_cache
      - gramps_cache:/app/cache
      - gramps_secret:/app/secret
      - gramps_db:/root/.gramps/grampsdb
      - gramps_media:/app/media
      - gramps_tmp:/tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # GrampsWeb Celery worker
  grampsweb_celery:
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: unless-stopped
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2
    environment:
      - GRAMPSWEB_TREE=${GRAMPSWEB_TREE:-Family Tree}
      - GRAMPSWEB_SECRET_KEY=${GRAMPSWEB_SECRET_KEY:-change-me-in-production}
      - GRAMPSWEB_CELERY_CONFIG__broker_url=redis://redis:6379/0
      - GRAMPSWEB_CELERY_CONFIG__result_backend=redis://redis:6379/0
      - GRAMPSWEB_RATELIMIT_STORAGE_URI=redis://redis:6379/1
      - GRAMPSWEB_USER_DB_URI=postgresql://namechart:namechart_secret@db:5432/grampsweb
    volumes:
      - gramps_users:/app/users
      - gramps_index:/app/indexdir
      - gramps_thumb_cache:/app/thumbnail_cache
      - gramps_cache:/app/cache
      - gramps_secret:/app/secret
      - gramps_db:/root/.gramps/grampsdb
      - gramps_media:/app/media
      - gramps_tmp:/tmp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      replicas: 0

  # WebTrees - Public genealogy
  webtrees:
    image: dtjs48jkt/webtrees:latest
    restart: unless-stopped
    ports:
      - "8081:443"
    environment:
      - WT_MODE=production
      - WT_DATA=/var/www/webtrees/data
      - WT_DB_TYPE=pgsql
      - WT_DB_HOST=db
      - WT_DB_PORT=5432
      - WT_DB_NAME=webtrees
      - WT_DB_USER=namechart
      - WT_DB_PASSWORD=namechart_secret
      - WT_ADMIN_USER=${WEBTREES_ADMIN_USER:-admin}
      - WT_ADMIN_EMAIL=${WEBTREES_ADMIN_EMAIL:-admin@example.com}
      - WT_ADMIN_PASSWORD=${WEBTREES_ADMIN_PASSWORD:-changeme123}
      - WT_BASE_URL=${WEBTREES_URL:-http://localhost:8081}
    volumes:
      - webtrees_data:/var/www/webtrees/data
      - webtrees_media:/var/www/webtrees/media
    depends_on:
      db:
        condition: service_healthy

  # Optional: Caddy reverse proxy for SSL (uncomment for production)
  # caddy:
  #   image: caddy:2-alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #   depends_on:
  #     - web
  #     - grampsweb

volumes:
  postgres_data:
  redis_data:
  gramps_users:
  gramps_index:
  gramps_thumb_cache:
  gramps_cache:
  gramps_secret:
  gramps_db:
  gramps_media:
  gramps_tmp:
  webtrees_data:
  webtrees_media:
  caddy_data:
