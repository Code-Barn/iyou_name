apiVersion: v1
kind: Secret
metadata:
  name: namechart-secrets
  namespace: namechart
type: Opaque
stringData:
  POSTGRES_USER: namechart
  POSTGRES_PASSWORD: CHANGE_ME_generate_strong_password
  SECRET_KEY: CHANGE_ME_generate_django_secret_key
  GRAMPSWEB_API_TOKEN: CHANGE_ME_grampsweb_api_token
---
apiVersion: v1
kind: Secret
metadata:
  name: grampsweb-secrets
  namespace: grampsweb
type: Opaque
stringData:
  SECRET_KEY: CHANGE_ME_generate_flask_secret_key
  EMAIL_HOST: CHANGE_ME_smtp_host
  EMAIL_HOST_USER: CHANGE_ME_smtp_user
  EMAIL_HOST_PASSWORD: CHANGE_ME_smtp_password
