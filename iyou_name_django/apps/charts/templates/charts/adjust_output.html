{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Adjust Chart Output</h2>

    <div class="card">
        <div class="card-body">
            <p class="card-text">
                Adjust the visual parameters of your family tree chart before generating the final PDF.
            </p>

            <form method="post" action="{% url 'generate' %}" class="mt-4">
                {% csrf_token %}

                <div class="row mb-4">
                    <div class="col-md-6">
                        <h4>Coordinate Adjustments</h4>

                        <div class="mb-3">
                            <label for="x_offset" class="form-label">X Offset</label>
                            <input type="number" class="form-control" id="x_offset" name="x_offset" value="0" step="0.1">
                        </div>

                        <div class="mb-3">
                            <label for="y_offset" class="form-label">Y Offset</label>
                            <input type="number" class="form-control" id="y_offset" name="y_offset" value="0" step="0.1">
                        </div>

                        <div class="mb-3">
                            <label for="scale" class="form-label">Scale Factor</label>
                            <input type="number" class="form-control" id="scale" name="scale" value="1.0" step="0.1">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <h4>Font Settings</h4>

                        <div class="mb-3">
                            <label for="font_size" class="form-label">Font Size</label>
                            <input type="number" class="form-control" id="font_size" name="font_size" value="12" min="8" max="24">
                        </div>

                        <div class="mb-3">
                            <label for="font_color" class="form-label">Font Color</label>
                            <input type="color" class="form-control" id="font_color" name="font_color" value="#000000">
                        </div>

                        <div class="mb-3">
                            <label for="font_family" class="form-label">Font Family</label>
                            <select class="form-select" id="font_family" name="font_family">
                                <option value="Arial">Arial</option>
                                <option value="Times New Roman">Times New Roman</option>
                                <option value="Helvetica">Helvetica</option>
                                <option value="Courier New">Courier New</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-12">
                        <h4>Preview</h4>
                        <div class="border p-3" style="min-height: 200px; background-color: #f8f9fa;">
                            <p class="text-center">Chart preview will appear here</p>
                            <!-- This will be replaced with actual preview functionality -->
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        Apply Adjustments & Generate
                    </button>
                    <a href="{% url 'browse:select_individual' %}" class="btn btn-outline-secondary ms-2">
                        Back to Selection
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
