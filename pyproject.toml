[project]
name = "namechart"
version = "0.1.0"
description = "genealogical chart generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "charset-normalizer>=3.4.6",
    "coverage>=7.13.1",
    "dj-database-url>=3.1.0",
    "django>=6.0",
    "django-environ>=0.12.0",
    "ged4py>=0.5.2",
    "pillow>=12.1.1",
    "psycopg2-binary>=2.9.11",
    "pycycle>=0.0.8",
    "pylint>=4.0.4",
    "requests>=2.32.5",
    "urllib3<2.6",
    "wand>=0.6.13",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.1.0",
    "ruff>=0.14.11",
]
