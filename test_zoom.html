<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Functionality Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .hud-preview-area {
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin: 20px auto;
            position: relative;
        }

        #hud-preview-container {
            width: 100%;
            height: 100%;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            overflow: hidden;
            background-color: #f8f9fa;
            position: relative;
        }

        #hud-preview {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }

        /* Magnifying glass styles */
        .magnifying-glass {
            position: absolute;
            border: 3px solid #007bff;
            border-radius: 50%;
            cursor: none;
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.5), 0 0 40px rgba(0, 123, 255, 0.3);
            pointer-events: none;
            z-index: 1000;
            display: none;
            background-repeat: no-repeat;
            background-color: white;
            transition: box-shadow 0.2s ease;
        }

        .magnifying-glass.active {
            display: block;
        }

        #hud-preview-container.magnifier-active {
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2>Zoom Functionality Test</h2>
        
        <div class="hud-preview-area">
            <div id="hud-preview-container">
                <img id="hud-preview" src="https://via.placeholder.com/600x400/007bff/ffffff?text=Test+Image+for+Zoom" />
            </div>
        </div>

        <div class="d-flex justify-content-center align-items-center mt-3">
            <div class="d-flex align-items-center">
                <button type="button" class="btn btn-outline-info btn-sm me-2" onclick="toggleZoomMode()" title="Toggle Zoom Mode (Scale/Magnifier)" id="zoom-mode-toggle">
                    <i class="bi bi-toggle-on" id="zoom-mode-icon"></i> <span id="zoom-mode-text">Scale</span>
                </button>
                <button type="button" class="btn btn-outline-success btn-sm me-2" onclick="zoomOut()" title="Zoom Out">
                    <i class="bi bi-zoom-out"></i> Zoom Out
                </button>
                <span class="mx-2 text-muted small">
                    <span id="zoom-display">100%</span>
                </span>
                <button type="button" class="btn btn-outline-success btn-sm ms-2" onclick="zoomIn()" title="Zoom In">
                    <i class="bi bi-zoom-in"></i> Zoom In
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm ms-2" onclick="resetZoom()" title="Reset Zoom">
                    <i class="bi bi-arrows-angle-expand"></i> Reset
                </button>
            </div>
        </div>

        <div class="mt-3">
            <div class="card card-body bg-light">
                <h6>Debug Info</h6>
                <div class="row">
                    <div class="col-md-6">
                        <small class="text-muted">
                            <strong>Zoom Level:</strong> <span id="debug-zoom-level">100%</span><br>
                            <strong>Mode:</strong> <span id="debug-zoom-mode">Scale</span><br>
                            <strong>Magnifier Zoom:</strong> <span id="debug-magnifier-zoom">2.0x</span>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let zoomMode = 'scale';
        let currentZoom = 100;
        let magnifierZoom = 2.0;
        let magnifierSize = 150;
        let magnifier = null;

        function initMagnifier() {
            if (!magnifier) {
                magnifier = document.createElement('div');
                magnifier.className = 'magnifying-glass';
                magnifier.style.width = magnifierSize + 'px';
                magnifier.style.height = magnifierSize + 'px';
                document.body.appendChild(magnifier);
            }
        }

        function toggleZoomMode() {
            const preview = document.getElementById('hud-preview');
            const container = document.getElementById('hud-preview-container');
            const modeIcon = document.getElementById('zoom-mode-icon');
            const modeText = document.getElementById('zoom-mode-text');
            const modeToggle = document.getElementById('zoom-mode-toggle');

            if (zoomMode === 'scale') {
                zoomMode = 'magnifier';
                initMagnifier();
                enableMagnifier();
                
                modeIcon.className = 'bi bi-search';
                modeText.textContent = 'Magnifier';
                modeToggle.className = 'btn btn-outline-warning btn-sm me-2';
                
                console.log('Switched to Magnifier mode');
            } else {
                zoomMode = 'scale';
                disableMagnifier();
                
                modeIcon.className = 'bi bi-toggle-on';
                modeText.textContent = 'Scale';
                modeToggle.className = 'btn btn-outline-info btn-sm me-2';
                
                console.log('Switched to Scale mode');
            }
            
            updateDebugInfo();
        }

        function enableMagnifier() {
            const container = document.getElementById('hud-preview-container');
            container.classList.add('magnifier-active');

            container.addEventListener('mousemove', updateMagnifier);
            container.addEventListener('mouseenter', () => {
                if (magnifier) magnifier.classList.add('active');
            });
            container.addEventListener('mouseleave', () => {
                if (magnifier) magnifier.classList.remove('active');
            });
        }

        function disableMagnifier() {
            const container = document.getElementById('hud-preview-container');
            container.classList.remove('magnifier-active');
            
            if (magnifier) magnifier.classList.remove('active');
            
            container.removeEventListener('mousemove', updateMagnifier);
        }

        function updateMagnifier(e) {
            const preview = document.getElementById('hud-preview');
            const container = document.getElementById('hud-preview-container');
            
            if (!preview || !container || !magnifier) return;

            const rect = container.getBoundingClientRect();
            const previewRect = preview.getBoundingClientRect();

            if (e.clientX < previewRect.left || e.clientX > previewRect.right ||
                e.clientY < previewRect.top || e.clientY > previewRect.bottom) {
                magnifier.classList.remove('active');
                return;
            }

            const x = e.clientX - previewRect.left;
            const y = e.clientY - previewRect.top;

            const magnifierX = e.clientX - magnifierSize / 2;
            const magnifierY = e.clientY - magnifierSize / 2;

            magnifier.style.left = magnifierX + 'px';
            magnifier.style.top = magnifierY + 'px';

            const effectiveZoom = magnifierZoom * (currentZoom / 100);
            const bgX = -(x * effectiveZoom - magnifierSize / 2);
            const bgY = -(y * effectiveZoom - magnifierSize / 2);

            magnifier.style.backgroundImage = `url(${preview.src})`;
            magnifier.style.backgroundSize = `${previewRect.width * effectiveZoom}px ${previewRect.height * effectiveZoom}px`;
            magnifier.style.backgroundPosition = `${bgX}px ${bgY}px`;
        }

        function zoomIn() {
            if (zoomMode === 'scale') {
                currentZoom = Math.min(currentZoom + 10, 200);
                applyScaleZoom();
            } else {
                magnifierZoom = Math.min(magnifierZoom + 0.25, 4.0);
            }
            updateDisplay();
        }

        function zoomOut() {
            if (zoomMode === 'scale') {
                currentZoom = Math.max(currentZoom - 10, 25);
                applyScaleZoom();
            } else {
                magnifierZoom = Math.max(magnifierZoom - 0.25, 1.0);
            }
            updateDisplay();
        }

        function resetZoom() {
            if (zoomMode === 'scale') {
                currentZoom = 100;
                applyScaleZoom();
            } else {
                magnifierZoom = 2.0;
            }
            updateDisplay();
        }

        function applyScaleZoom() {
            const preview = document.getElementById('hud-preview');
            const scale = currentZoom / 100;
            preview.style.transform = `scale(${scale})`;
            preview.style.transformOrigin = 'center center';
        }

        function updateDisplay() {
            const zoomDisplay = document.getElementById('zoom-display');
            if (zoomMode === 'scale') {
                zoomDisplay.textContent = currentZoom + '%';
            } else {
                zoomDisplay.textContent = Math.round(magnifierZoom * 100) + '%';
            }
            updateDebugInfo();
        }

        function updateDebugInfo() {
            document.getElementById('debug-zoom-level').textContent = currentZoom + '%';
            document.getElementById('debug-zoom-mode').textContent = zoomMode.charAt(0).toUpperCase() + zoomMode.slice(1);
            document.getElementById('debug-magnifier-zoom').textContent = magnifierZoom.toFixed(1) + 'x';
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(event) {
            if ((event.ctrlKey || event.metaKey)) {
                if (event.key === '+' || event.key === '=') {
                    event.preventDefault();
                    zoomIn();
                } else if (event.key === '-') {
                    event.preventDefault();
                    zoomOut();
                } else if (event.key === '0') {
                    event.preventDefault();
                    resetZoom();
                }
            }
        });

        // Mouse wheel zoom
        document.getElementById('hud-preview-container').addEventListener('wheel', function(event) {
            if (event.ctrlKey || event.metaKey) {
                event.preventDefault();
                if (event.deltaY < 0) {
                    zoomIn();
                } else {
                    zoomOut();
                }
            }
        });

        updateDebugInfo();
    </script>
</body>
</html>
