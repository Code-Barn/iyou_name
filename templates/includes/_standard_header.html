<header class="w-full border-b border-slate-200 bg-white text-slate-900 px-6 py-3 flex items-center justify-between font-mono text-sm shadow-sm pt-5">
    <div class="flex items-center space-x-2">
        <span class="font-bold tracking-tight text-purple-600">iyou_</span>
        <span class="text-slate-500 font-semibold">name</span>
    </div>

    <div class="flex items-center space-x-4 text-xs">
        {% if request.user.is_authenticated %}
            <div class="flex items-center space-x-2 bg-slate-100 px-3 py-1 rounded border border-slate-200">
                <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-slate-600 font-bold" title="{{ request.user.username }}">{{ request.user.username }}</span>
            </div>
            <a href="{% url 'oidc_logout' %}" class="text-slate-400 hover:text-rose-500 transition-colors duration-150">Sign Out</a>
        {% endif %}
    </div>
</header>
