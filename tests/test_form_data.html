<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form Data Test</title>
</head>
<body>
    <h1>Form Data Test</h1>
    
    <form id="test-form">
        <div>
            <label>Font Size: <span id="font-size-value">88</span></label>
            <input type="range" name="font_size" id="font-size-slider" min="38" max="138" value="88">
        </div>
        
        <div>
            <label>Font Family:</label>
            <select name="font_family">
                <option value="Arial">Arial</option>
                <option value="Times New Roman">Times New Roman</option>
            </select>
        </div>
        
        <div>
            <label>Color:</label>
            <input type="color" name="color" value="#000000">
        </div>
        
        <button type="button" onclick="testFormData()">Test Form Data</button>
    </form>
    
    <script>
        // Set up slider event listener
        document.getElementById('font-size-slider').addEventListener('input', function() {
            document.getElementById('font-size-value').textContent = this.value;
            console.log(`Slider changed to: ${this.value}`);
        });
        
        function testFormData() {
            const form = document.getElementById('test-form');
            const formData = new FormData(form);
            
            console.log("=== FORM DATA TEST ===");
            console.log("font_size:", formData.get('font_size'));
            console.log("font_family:", formData.get('font_family'));
            console.log("color:", formData.get('color'));
            
            // Also check direct input values
            const slider = document.getElementById('font-size-slider');
            const select = document.querySelector('select[name="font_family"]');
            const colorInput = document.querySelector('input[name="color"]');
            
            console.log("=== DIRECT INPUT VALUES ===");
            console.log("slider.value:", slider.value);
            console.log("select.value:", select.value);
            console.log("colorInput.value:", colorInput.value);
            
            // Test JSON serialization
            const jsonData = {
                font_size: formData.get('font_size'),
                font_family: formData.get('font_family'),
                color: formData.get('color')
            };
            
            console.log("=== JSON DATA ===");
            console.log(JSON.stringify(jsonData, null, 2));
        }
    </script>
</body>
</html>
