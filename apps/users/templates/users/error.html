{% extends "core/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h2 class="mb-0">User Error</h2>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger">
                        <h4 class="alert-heading">Error</h4>
                        <p>{{ error|default:"An error occurred in the user interface." }}</p>
                    </div>

                    <div class="mt-4">
                        <a href="{% url 'users:profile' %}" class="btn btn-primary">
                            <i class="bi bi-arrow-left"></i> Return to Profile
                        </a>
                        <a href="{% url 'upload:home' %}" class="btn btn-secondary">
                            <i class="bi bi-house"></i> Return to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
