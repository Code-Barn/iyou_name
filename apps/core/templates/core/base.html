{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Namechart Generator</title>
        <!-- Add favicon -->
        <link
            rel="icon"
            href="{% static 'favicon.ico' %}"
            type="image/x-icon"
        />
        <!-- Add Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="{% url 'upload:home' %}">
                    <img src="{% static 'core/images/tinynamelogo.png' %}" alt="Logo" />
                </a>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{% url 'upload:home' %}"
                                >Upload</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{% url 'browse:browse_individuals' %}"
                                >Browse</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{% url 'users:profile' %}"
                                >Profile</a
                            >
                        </li>
                        {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{% url 'users:logout' %}"
                                >Logout</a
                            >
                        </li>
                        {% else %}
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{% url 'users:login' %}"
                                >Login</a
                            >
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-4">{% block content %}{% endblock %}</div>
        <!-- Add this to your base template (e.g., core/base.html) -->
        <script>
        document.addEventListener('beforeunload', function() {
            const fileId = '{{ current_gedcom_file_id|default:"" }}';
            if (fileId) {
                fetch('/delete-anonymous-file/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ file_id: fileId }),
                });
            }
        });
        </script>

        <!-- Add Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
