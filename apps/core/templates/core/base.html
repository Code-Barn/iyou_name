{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Namechart Generator</title>

        <!-- Add favicon -->
        <link
            rel="icon"
            href="{% static 'core/favicon.ico' %}"
            type="image/x-icon"
        />
        <link
            rel="apple-touch-icon"
            href="{% static 'core/images/icon.png' %}"
        />
        <!-- Add Bootstrap CSS - Structural Bridge for Grid System -->
        <link
            href="{% static 'vendor/bootstrap/bootstrap.min.css' %}"
            rel="stylesheet"
        />
        <!-- Add Bootstrap Icons -->
        <link
            rel="stylesheet"
            href="{% static 'vendor/bootstrap/icons/bootstrap-icons.css' %}"
        />
        <!-- Bootstrap Grid Structural Bridge - Ensure container, row, col-* classes work -->
        <style>
            /* Bootstrap 5 Grid System - Critical structural classes */
            .container {
                width: 100%;
                padding-right: var(--bs-gutter-x, 0.75rem);
                padding-left: var(--bs-gutter-x, 0.75rem);
                margin-right: auto;
                margin-left: auto;
            }
            @media (min-width: 576px) {
                .container {
                    max-width: 540px;
                }
            }
            @media (min-width: 768px) {
                .container {
                    max-width: 720px;
                }
            }
            @media (min-width: 992px) {
                .container {
                    max-width: 960px;
                }
            }
            @media (min-width: 1200px) {
                .container {
                    max-width: 1140px;
                }
            }
            @media (min-width: 1400px) {
                .container {
                    max-width: 1320px;
                }
            }
            .row {
                --bs-gutter-x: 1.5rem;
                --bs-gutter-y: 0;
                display: flex;
                flex-wrap: wrap;
                margin-top: calc(-1 * var(--bs-gutter-y));
                margin-right: calc(-0.5 * var(--bs-gutter-x));
                margin-left: calc(-0.5 * var(--bs-gutter-x));
            }
            .row > * {
                flex-shrink: 0;
                width: 100%;
                max-width: 100%;
                padding-right: calc(var(--bs-gutter-x) * 0.5);
                padding-left: calc(var(--bs-gutter-x) * 0.5);
                margin-top: var(--bs-gutter-y);
            }
            .col-1 { flex: 0 0 auto; width: 8.333333% }
            .col-2 { flex: 0 0 auto; width: 16.666667% }
            .col-3 { flex: 0 0 auto; width: 25% }
            .col-4 { flex: 0 0 auto; width: 33.333333% }
            .col-5 { flex: 0 0 auto; width: 41.666667% }
            .col-6 { flex: 0 0 auto; width: 50% }
            .col-7 { flex: 0 0 auto; width: 58.333333% }
            .col-8 { flex: 0 0 auto; width: 66.666667% }
            .col-9 { flex: 0 0 auto; width: 75% }
            .col-10 { flex: 0 0 auto; width: 83.333333% }
            .col-11 { flex: 0 0 auto; width: 91.666667% }
            .col-12 { flex: 0 0 auto; width: 100% }
            .card {
                position: relative;
                display: flex;
                flex-direction: column;
                min-width: 0;
                word-wrap: break-word;
                background-color: #fff;
                background-clip: border-box;
                border: 1px solid rgba(0, 0, 0, 0.125);
                border-radius: 0.25rem;
            }
            .card-body {
                flex: 1 1 auto;
                padding: 1rem 1rem;
            }
            .form-control {
                display: block;
                width: 100%;
                padding: 0.375rem 0.75rem;
                font-size: 1rem;
                font-weight: 400;
                line-height: 1.5;
                color: #212529;
                background-color: #fff;
                background-clip: padding-box;
                border: 1px solid #ced4da;
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
                border-radius: 0.25rem;
                transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            }
            .btn {
                display: inline-block;
                font-weight: 400;
                line-height: 1.5;
                color: #212529;
                text-align: center;
                text-decoration: none;
                vertical-align: middle;
                cursor: pointer;
                -webkit-user-select: none;
                -moz-user-select: none;
                user-select: none;
                background-color: transparent;
                border: 1px solid transparent;
                padding: 0.375rem 0.75rem;
                font-size: 1rem;
                border-radius: 0.25rem;
                transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            }
            .btn-primary {
                color: #fff;
                background-color: #0d6efd;
                border-color: #0d6efd;
            }
            .btn-primary:hover {
                color: #fff;
                background-color: #0b5ed7;
                border-color: #0a58ca;
            }
            .alert {
                position: relative;
                padding: 0.75rem 1.25rem;
                margin-bottom: 1rem;
                border: 1px solid transparent;
                border-radius: 0.25rem;
            }
            .alert-info {
                color: #084298;
                background-color: #cff4fc;
                border-color: #b6effb;
            }
            .navbar {
                position: relative;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                padding: 0.5rem 1rem;
            }
            .navbar-expand-lg .navbar-collapse {
                display: flex;
                flex-basis: 100%;
                flex-grow: 1;
                align-items: center;
            }
            .navbar-light .navbar-nav .nav-link {
                color: rgba(0, 0, 0, 0.55);
            }
            .nav-item {
                padding: 0.5rem 0;
            }
            .nav-link {
                display: block;
                padding: 0.5rem 1rem;
                color: rgba(0, 0, 0, 0.55);
                text-decoration: none;
                transition: color 0.15s ease-in-out;
            }
            .nav-link:hover {
                color: rgba(0, 0, 0, 0.7);
            }
        </style>

        <!-- CSRF Token for requests -->
        <meta name="csrf-token" content="{{ csrf_token }}">

        <!-- CSS Variables for theming -->
        <style>
            :root {
                --primary-color: #0d6efd;
                --primary-hover: #0b5ed7;
                --primary-focus: #0a58ca;
                --text-color: #212529;
                --bg-color: #f8f9fa;
                --bg-secondary: #ffffff;
                --border-color: #dee2e6;
                --success-color: #198754;
                --error-color: #dc3545;
                --warning-color: #ffc107;
                --info-color: #0dcaf0;
            }
            html.dark {
                --primary-color: #6ea8fe;
                --primary-hover: #0d6efd;
                --primary-focus: #0b5ed7;
                --text-color: #f8f9fa;
                --bg-color: #212529;
                --bg-secondary: #343a40;
                --border-color: #495057;
                --success-color: #198754;
                --error-color: #dc3545;
                --warning-color: #ffc107;
                --info-color: #6ea8fe;
            }
            /* Responsive navbar images - prevent horizontal overflow on mobile */
            @media (max-width: 576px) {
                #navbar-harp {
                    height: 40px !important;
                    max-width: 80px !important;
                    width: auto !important;
                }
                .navbar-brand {
                    flex-shrink: 1;
                }
                /* Prevent horizontal scroll on mobile */
                html, body {
                    overflow-x: hidden;
                }
            }



        </style>

        <!-- Zero-flash theme init: name_theme cookie > localStorage > light -->
        <script>
          (function() {
            var cookieMatch = document.cookie.match(/(?:^|; )name_theme=([^;]*)/);
            var theme = cookieMatch ? decodeURIComponent(cookieMatch[1]) : (localStorage.getItem('name_theme') || 'light');
            if (theme === 'dark' || theme === 'stealth') {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          })();
        </script>
        <!-- STATIC TAILWIND CSS (compiled via `npm run tailwind:build`) -->
        <link rel="stylesheet" href="{% static 'css/output.css' %}">
    </head>
    <body class="min-h-screen flex flex-col transition-colors duration-200 bg-slate-50 text-slate-900 dark:bg-[#0B0F19] dark:text-gray-200">
        {% include 'includes/_ecosystem_bar.html' %}
        {% include 'includes/_standard_header.html' %}
        {% include 'includes/_tailwind_safe_init.html' %}
        {% include 'includes/_nav.html' %}

        <div class="container mt-4 pt-5">
            {% block content %}
            {% endblock %}
        </div>

        {% include 'includes/_footer.html' %}
        <!-- Add this to your base template (e.g., core/base.html) -->
        <script>
        document.addEventListener('beforeunload', function() {
            const fileId = '{{ current_gedcom_file_id|default:"" }}';
            if (fileId) {
                fetch('/delete-anonymous-file/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ file_id: fileId }),
                });
            }
        });
        </script>

        <!-- Add Bootstrap JS -->
        <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
        <!-- Theme engine: dual persistence (cookie + localStorage) + SVG icon toggle -->
        <script src="{% static 'js/theme.js' %}"></script>
        <!-- Navbar logo sync on load -->
        <script>
        (function() {
            var logo = document.getElementById('navbar-logo');
            if (logo) {
                logo.src = document.documentElement.classList.contains('dark')
                    ? '{% static "core/images/tinynamelogo_DM.png" %}'
                    : '{% static "core/images/tinynamelogo.png" %}';
            }
        })();
        </script>
    </body>
</html>
