{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Namechart Generator</title>

        <!-- Add favicon -->
        <link
            rel="icon"
            href="{% static 'core/favicon.ico' %}"
            type="image/x-icon"
        />
        <!-- Add Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <!-- Add Bootstrap Icons -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
        />
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="{% url 'upload:home' %}">
                    <img src="{% static 'core/images/tinynamelogo.png' %}" alt="Logo" />
                    <img src="{% static 'core/images/namechartharp.png' %}" alt="Namechart Harp" class="ms-2" height="60" />
                </a>
                <span class="navbar-text mx-auto fw-bold fst-italic">
                    "Explore Your Ancestry!"
                </span>
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{% url 'upload:home' %}"
                                >Upload</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{% url 'browse:browse_individuals' %}"
                                >Browse</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{% url 'users:profile' %}"
                                >Profile</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://github.com" target="_blank" rel="noopener noreferrer">
                                <i class="bi bi-github"></i>
                            </a>
                        </li>
                        {% if user.is_authenticated %}
                        <li class="nav-item d-flex align-items-center">
                            <form method="post" action="{% url 'users:logout' %}" class="d-flex align-items-center">
                                {% csrf_token %}
                                <button type="submit" class="nav-link" style="background: none; border: none; padding: 0; margin: 0; cursor: pointer; line-height: 1.5;">Logout</button>
                            </form>
                        </li>
                        {% else %}
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="{% url 'users:login' %}"
                                >Login</a
                            >
                        </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>


        <div class="container mt-4">
            {% block content %}
            {% endblock %}
        </div>

        <!-- Footer -->
        <footer class="bg-light py-4 mt-5">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-6 text-center text-md-start">
                        <img src="{% static 'core/images/tinynamelogo.png' %}" alt="Namechart Logo" height="60" class="mb-3">
                        <p class="mb-0">&copy; 2024 Namecharts.org. All rights reserved.</p>
                    </div>
                    <div class="col-md-6 text-center text-md-end">
                        <img src="{% static 'core/images/createdinDeKalb.png' %}" alt="Created in DeKalb" height="125" class="mt-2">
                    </div>
                </div>
            </div>
        </footer>
        <!-- Add this to your base template (e.g., core/base.html) -->
        <script>
        document.addEventListener('beforeunload', function() {
            const fileId = '{{ current_gedcom_file_id|default:"" }}';
            if (fileId) {
                fetch('/delete-anonymous-file/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ file_id: fileId }),
                });
            }
        });
        </script>

        <!-- Add Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
