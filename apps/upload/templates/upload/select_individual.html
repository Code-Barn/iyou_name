{% extends 'core/base.html' %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Select Primary Individual</h2>

    <div class="card">
        <div class="card-body">
            <p class="card-text">
                Choose the individual whose namechart you want to generate.
                {% if template %}
                <br />Selected template: {{ template }}
                {% else %}
                <br />Selected template: 4gen (default)
                {% endif %}
            </p>

            <form
                method="post"
                action="{% url 'browse:select_individual' %}"
                class="mt-4"
            >
                {% csrf_token %}

                <div class="mb-3">
                    <label for="primary_individual" class="form-label"
                        >Primary Individual</label
                    >
                    <select
                        class="form-select"
                        id="primary_individual"
                        name="individual_id"
                        required
                    >
                        <option value="" selected disabled>
                            Select an individual...
                        </option>
                        {% for individual in individuals %}
                        <option value="{{ individual.id }}" {% if individual.id == request.GET.individual_id or individual.id == "I1" or individual.id == home_person_id %}selected{% endif %}>
                            {{ individual.full_name }} {% if individual.id == home_person_id %}(Home Person){% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="template" class="form-label"
                        >Chart Template</label
                    >
                    <select
                        class="form-select"
                        id="template"
                        name="template"
                        required
                    >
                        <option value="" selected disabled>
                            Select a template...
                        </option>
                        {% for key, template in TEMPLATE_MAPPING.items %}
                        <option value="{{ key }}" {% if key == selected_template %}selected{% endif %}>
                            {{ template.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <script>
                    document
                        .querySelector("form")
                        .addEventListener("submit", function (e) {
                            console.log("Form submitted");
                            console.log(
                                "Selected ID:",
                                document.getElementById("primary_individual")
                                    .value,
                            );
                        });
                </script>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        Generate Chart
                    </button>
                    <a
                        href="{% url 'upload:home' %}"
                        class="btn btn-outline-secondary ms-2"
                    >
                        Back to Home
                    </a>
                </div>
            </form>
        </div>
    </div>
    <script>
                window.familyTreeHUD.init();
            }
        });
    </script>
</div>
{% endblock %}
