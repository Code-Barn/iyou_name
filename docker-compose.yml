services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=namechart
      - POSTGRES_USER=namechart_user
      - POSTGRES_PASSWORD=your_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namechart_user -d namechart"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: iyou_name/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NAME_SECRET_KEY=django-insecure-dev-only-key-not-for-production
      - NAME_DEBUG=True
      - NAME_ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=postgres://namechart_user:your_password@db:5432/namechart
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
